name: Build Native Android APK (ZF Agri)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile ZF Agri Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android directory or gradlew missing. Initializing with Capacitor..."
            rm -rf android
            npx cap add android
          fi

          for dir in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$dir"
            cp public/pwa-512x512.png "android/app/src/main/res/mipmap-$dir/ic_launcher.png" 2>/dev/null || true
            cp public/pwa-512x512.png "android/app/src/main/res/mipmap-$dir/ic_launcher_round.png" 2>/dev/null || true
            cp public/pwa-maskable-512x512.png "android/app/src/main/res/mipmap-$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done

          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Native APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/ZF_Agri.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZF_Agri-Native-APK
          path: output/ZF_Agri.apk
          retention-days: 30

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ZF Agri Native Android v1.0.${{ github.run_number }}
          body: |
            Application Android Native ZF Agri
            - 100% Autonome et embarquée localement
            - Pas de dépendance serveur Vercel
            - Logo et interface ZF Agri intégrés
          files: output/ZF_Agri.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
